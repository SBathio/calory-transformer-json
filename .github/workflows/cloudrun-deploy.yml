name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: calory-transformer-json
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v3

      - name: 🔧 Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: ✅ Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 🛠 Build with Gradle
        run: ./gradlew clean build

      - name: 🧱 Build & Push Docker Image to Artifact Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/docker-repo/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: 🚀 Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: calory-transformer
          region: us-central1
          image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/docker-repo/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}