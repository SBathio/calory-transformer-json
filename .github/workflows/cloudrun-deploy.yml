name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v3

      - name: 🔧 Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: ⚙️ Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🛠️ Build project with Gradle
        run: ./gradlew clean build

      - name: 🧪 Verify JAR is built
        run: ls -l build/libs

      - name: 🔐 Authenticate Docker to Google Cloud
        uses: docker/login-action@v2
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIALS }}

      - name: 🧱 Build and Push Docker image to Google Container Registry
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: docker.io/sigoubathily/calory-transformer-json:latest

      - name: 🚀 Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: calory-transformer
          region: us-central1
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/calory-transformer-json:latest
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}